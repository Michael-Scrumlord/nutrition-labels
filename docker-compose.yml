version: '3.9'

# Production compose. Caddy is the only public entry point — neither the
# backend nor the frontend nginx is reachable from the host directly.
#
# For local browsing without Caddy/TLS, layer in docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# That override publishes frontend:5173 and backend:8000 and disables Caddy.
#
# First-time setup (either mode):
#   1. Run scripts/download_fdc.sh to fetch USDA FDC CSV data.
#   2. docker compose up --build
#      The db-init service builds nutrition.db on the nutrition_db volume (one-time).
#      Subsequent restarts skip the build because the DB already exists.

services:

  # ── One-time DB builder ────────────────────────────────────────────────────
  # Runs build_db_full.py, writes nutrition.db to the nutrition_db volume, then exits.
  # The backend waits for this to complete before starting.
  # On subsequent deploys it exits immediately (DB already exists).
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dbbuilder
    environment:
      - FDC_DATA_DIR=/fdc-source
      - DB_PATH=/db/nutrition.db
    volumes:
      - ./backend/data/fdc:/fdc-source:ro
      - nutrition_db:/db
    restart: "no"

  # ── API server ─────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # `*` is safe here because the backend has no `ports:` mapping —
      # only `expose:` — so port 8000 is reachable solely from inside
      # the docker network. The only container on that network that
      # talks to the backend is nginx, which forwards Caddy's already-
      # sanitized X-Forwarded-For (see Caddyfile + nginx.conf #4 fix).
      # Gunicorn's --forwarded-allow-ips doesn't accept CIDR notation,
      # so we can't narrow this any further without per-IP enumeration.
      # The backend is `expose`d only (not `ports:` published), so its TCP peer
      # is always the frontend (nginx) container on the docker bridge — whose
      # IP is dynamic. Accepting X-Forwarded-For from any peer is acceptable
      # *only* because nothing outside the docker network can reach :8000.
      # Do not copy this setting to a deployment where the backend port is
      # directly reachable — it would let any client spoof their source IP
      # and bypass the slowapi rate limits. See .env.example for guidance.
      - FORWARDED_ALLOW_IPS=*
      - CORS_ORIGINS=[]
      - DB_PATH=/db/nutrition.db
    volumes:
      - nutrition_db:/db:ro
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 1g gives WeasyPrint headroom for transient spikes (150–250 MB per
    # render) at pdf_max_concurrency=2 + 2 gunicorn workers. The previous
    # 512m was within OOM range of worst-case concurrent PDF generation.
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Static frontend ────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5

  # ── Reverse proxy / TLS ────────────────────────────────────────────────────
  # Built locally so we can include the caddy-ratelimit community plugin —
  # the stock image doesn't ship the `rate_limit` directive. See caddy/Dockerfile.
  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
  nutrition_db:
