version: '3.9'

# Production compose. For local dev without Caddy/TLS, use
# docker-compose.dev.yml (or just expose frontend:5173 directly).
#
# First-time setup:
#   1. Run scripts/download_fdc.sh to fetch USDA FDC CSV data.
#   2. docker-compose up --build
#      The db-init service builds nutrition.db on the nutrition_db volume (one-time).
#      Subsequent restarts skip the build because the DB already exists.

services:

  # ── One-time DB builder ────────────────────────────────────────────────────
  # Runs build_db_full.py, writes nutrition.db to the nutrition_db volume, then exits.
  # The backend waits for this to complete before starting.
  # On subsequent deploys it exits immediately (DB already exists).
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dbbuilder
    environment:
      - FDC_DATA_DIR=/fdc-source
      - DB_PATH=/db/nutrition.db
    volumes:
      - ./backend/data/fdc:/fdc-source:ro
      - nutrition_db:/db
    restart: "no"

  # ── API server ─────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # The backend is `expose`d only (not `ports:` published), so its TCP peer
      # is always the frontend (nginx) container on the docker bridge — whose
      # IP is dynamic. Accepting X-Forwarded-For from any peer is acceptable
      # *only* because nothing outside the docker network can reach :8000.
      # Do not copy this setting to a deployment where the backend port is
      # directly reachable — it would let any client spoof their source IP
      # and bypass the slowapi rate limits. See .env.example for guidance.
      - FORWARDED_ALLOW_IPS=*
      - CORS_ORIGINS=[]
      - DB_PATH=/db/nutrition.db
    volumes:
      - nutrition_db:/db:ro
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Static frontend ────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "5173:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5

  # ── Reverse proxy / TLS ────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
  nutrition_db:
