name: CI

# Runs on every push to long-lived branches and on every PR targeting master.
# Three jobs run in parallel: backend tests, frontend build, docker build.
# See docs/DEPLOY.md for how to enable branch protection so failing CI blocks
# merges to master.

on:
  push:
    branches: [master, Development]
  pull_request:
    branches: [master]

jobs:
  # ── Python: install deps + run the pytest suite ──────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint needs Pango/Cairo at import time, even for tests that
      # don't render PDFs. apt-installing here is faster than building from source.
      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libcairo-gobject2 \
            libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      # test_db_health.py reads the real nutrition.db, which doesn't exist in
      # CI (it's built on-host from FDC data). Skip that file here; the rest
      # of the suite uses the in-memory fixture from conftest.py.
      - name: Run pytest
        working-directory: backend
        run: pytest --ignore=tests/test_db_health.py

  # ── Frontend: install deps + production build ────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ── Frontend: Playwright layout + a11y suite ─────────────────────────────
  # Real-browser layout assertions (scrollWidth ≤ clientWidth across routes /
  # viewports) plus axe-core a11y smoke. jsdom can't compute layout, so these
  # live in a separate Playwright project rather than in `npm test`.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      # Cache the Playwright browser binary keyed on the installed version
      # so we don't redownload Chromium (~100 MB) on every run.
      - name: Resolve Playwright version
        id: pw-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # If the browser was cached, system libs still need to be present on
      # this runner — install just those (cheap).
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ── Docker: every image (db-init, backend, frontend, caddy) must build ──
  # Catches Dockerfile typos, missing files, and dep-resolution breakage
  # without actually running anything.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker compose build needs DOMAIN even though we're not running the
      # stack — it's substituted into the Caddyfile mount.
      - name: Build all images
        run: DOMAIN=ci.example.com docker compose build
