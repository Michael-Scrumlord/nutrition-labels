# Security headers applied to every response.
#
# This file is `include`d inside each `location` block in nginx.conf, NOT at
# the server level. Reason: nginx's `add_header` inheritance is all-or-nothing
# — if a location block contains any `add_header`, it loses every `add_header`
# inherited from the parent. Defining them once here and including them
# everywhere keeps the config DRY without tripping that rule.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content Security Policy.
#
# 'unsafe-inline' for style-src is required because the React build uses
# inline style attributes and the editorial theme injects CSS variables
# at runtime. If you remove inline styles, drop it.
#
# 'wasm-unsafe-eval' on script-src is required by @react-pdf/renderer: it
# uses a WebAssembly font subsetter (harfbuzz/fontkit) to embed TeX Gyre
# Heros into the generated PDF. Without this directive the browser blocks
# WebAssembly.instantiate(). This is the narrow CSP3 directive that permits
# WASM only — it does NOT enable eval() or new Function() the way the older
# 'unsafe-eval' would. If client-side PDF generation is ever removed, drop
# this token too.
#
# The fonts.googleapis.com / fonts.gstatic.com entries cover the Google
# Fonts stylesheet + woff2 binaries pulled in from frontend/index.html.
#
# Everything tagged "# AdSense" enables Google AdSense + Funding Choices
# (CMP). Removing any of those lines will silently break ad serving or
# the GDPR consent banner. Origins documented per Google's published
# CSP guidance: developers.google.com/adsense/platforms/direct/csp
add_header Content-Security-Policy
    "default-src 'self'; \
     script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' \
        https://pagead2.googlesyndication.com \
        https://www.googletagservices.com \
        https://fundingchoicesmessages.google.com \
        https://adservice.google.com \
        https://www.google.com; \
     style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
     img-src 'self' data: https:; \
     font-src 'self' data: https://fonts.gstatic.com; \
     connect-src 'self' \
        https://pagead2.googlesyndication.com \
        https://googleads.g.doubleclick.net \
        https://ep1.adtrafficquality.google \
        https://ep2.adtrafficquality.google; \
     frame-src \
        https://googleads.g.doubleclick.net \
        https://tpc.googlesyndication.com \
        https://www.google.com \
        https://fundingchoicesmessages.google.com; \
     frame-ancestors 'none'; \
     base-uri 'self'; \
     form-action 'self'; \
     object-src 'none'" always;
