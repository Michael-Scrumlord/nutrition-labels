# Internal nginx — the frontend container. In production this sits behind
# Caddy, which handles TLS, HSTS, and external rate limiting.

# Don't advertise the nginx version in Server: headers or error pages.
server_tokens off;

# gzip is fine on the same-host hop to the edge.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (applied to everything we serve) ─────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content Security Policy.
    #
    # 'unsafe-inline' for style-src is required because the React build uses
    # inline style attributes and the editorial theme injects CSS variables
    # at runtime. If you remove inline styles, drop it.
    #
    # The fonts.googleapis.com / fonts.gstatic.com entries cover the Google
    # Fonts stylesheet + woff2 binaries pulled in from frontend/index.html.
    # (This was implicitly broken before Phase 5 — browsers were blocking
    # the Google Fonts <link> under the old 'self'-only style-src.)
    #
    # Everything tagged "# AdSense" enables Google AdSense + Funding Choices
    # (CMP). Removing any of those lines will silently break ad serving or
    # the GDPR consent banner. Origins documented per Google's published
    # CSP guidance: developers.google.com/adsense/platforms/direct/csp
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' \
            https://pagead2.googlesyndication.com \
            https://www.googletagservices.com \
            https://fundingchoicesmessages.google.com \
            https://adservice.google.com \
            https://www.google.com; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         img-src 'self' data: https:; \
         font-src 'self' data: https://fonts.gstatic.com; \
         connect-src 'self' \
            https://pagead2.googlesyndication.com \
            https://googleads.g.doubleclick.net \
            https://ep1.adtrafficquality.google \
            https://ep2.adtrafficquality.google; \
         frame-src \
            https://googleads.g.doubleclick.net \
            https://tpc.googlesyndication.com \
            https://www.google.com \
            https://fundingchoicesmessages.google.com; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self'; \
         object-src 'none'" always;

    # ── Proxy /api/* to the backend container ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 128k;
    }

    # ── Static assets: hashed by Vite, safe to cache hard ────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback: never cache the entry point ────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
