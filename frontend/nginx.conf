# Internal nginx — the frontend container. In production this sits behind
# Caddy, which handles TLS, HSTS, and external rate limiting.

# Don't advertise the nginx version in Server: headers or error pages.
server_tokens off;

# gzip is fine on the same-host hop to the edge.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are NOT declared here at the server level. nginx's
    # `add_header` inheritance is all-or-nothing: any `add_header` inside a
    # location block silently drops every parent `add_header`. We instead
    # `include security-headers.conf` inside each location below.

    # ── Proxy /api/* to the backend container ─────────────────────────────
    location /api/ {
        include /etc/nginx/security-headers.conf;

        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Use $http_x_forwarded_for (raw incoming header), NOT
        # $proxy_add_x_forwarded_for (which appends to whatever the client
        # sent). Our only upstream is Caddy, which uses `header_up
        # X-Forwarded-For {remote_host}` to *replace* the header with the
        # real client IP, so the incoming value is trustworthy. Appending
        # would let a client smuggle a fake leftmost IP and bypass the
        # slowapi per-IP rate limits.
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 128k;
    }

    # ── Static assets: hashed by Vite, safe to cache hard ────────────────
    location /assets/ {
        include /etc/nginx/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── SPA fallback: never cache the entry point ────────────────────────
    location = /index.html {
        include /etc/nginx/security-headers.conf;

        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;

        # Belt-and-suspenders no-store: the try_files internal redirect to
        # /index.html re-matches `location = /index.html` (which also sets
        # no-store), but setting it here too covers any direct hit on `/`
        # or other root-served files.
        add_header Cache-Control "no-store" always;

        try_files $uri $uri/ /index.html;
    }
}
