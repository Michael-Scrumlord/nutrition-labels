<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Nutrition Label Generator — FDA Nutrition Label Builder">
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- editorial rule top -->
  <rect x="0" y="0" width="1200" height="8" fill="#ff2e88"/>
  <!-- kicker -->
  <text x="80" y="180"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        font-weight="700" font-size="22" letter-spacing="6"
        fill="#ff2e88">▸ GENERATOR · v · 04</text>
  <!-- wordmark -->
  <text x="80" y="350"
        font-family="'IBM Plex Serif', Georgia, serif"
