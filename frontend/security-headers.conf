# Security headers applied to every response.
#
# This file is `include`d inside each `location` block in nginx.conf, NOT at
# the server level. Reason: nginx's `add_header` inheritance is all-or-nothing
# — if a location block contains any `add_header`, it loses every `add_header`
# inherited from the parent. Defining them once here and including them
# everywhere keeps the config DRY without tripping that rule.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content Security Policy.
#
# The CSP value MUST be on a single physical line. Earlier revisions of this
# file used backslash line-continuations inside the quoted string — nginx
# does NOT honour `\` as a line-continuation INSIDE quoted strings (only
# outside them, between directive tokens). The result was an obs-fold header
# with literal backslashes and embedded newlines in the value, which most
# browsers tolerate but some (and CSP validators) reject. Keep this on one
# line. Use the comments below to document the rationale per token.
#
# Directive notes:
#   • style-src 'unsafe-inline'    — React inline style attributes + theme CSS vars
#   • script-src 'unsafe-inline'   — React inline JSON state hydration
#   • script-src 'wasm-unsafe-eval'— @react-pdf/renderer uses a WASM font subsetter
#                                    (harfbuzz/fontkit) to embed TeX Gyre Heros.
#                                    This is the narrow CSP3 token that permits
#                                    WebAssembly.instantiate() ONLY — it does NOT
#                                    enable eval()/new Function(). Drop it if
#                                    client-side PDF generation is removed.
#   • worker-src 'self' blob:      — @react-pdf/renderer wraps its worker source
#                                    in a Blob and calls new Worker(blob:URL).
#                                    Without 'blob:' the worker is blocked.
#   • font-src https://fonts.gstatic.com — Google Fonts woff2 binaries
#   • style-src https://fonts.googleapis.com — Google Fonts CSS
#   • *.googlesyndication.com / *.google.com / etc — AdSense + Funding Choices
#     (CMP). Removing these silently breaks ad serving or the GDPR banner.
#     Origins per Google's published guidance:
#     developers.google.com/adsense/platforms/direct/csp
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagservices.com https://fundingchoicesmessages.google.com https://adservice.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
